<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Counter Widget</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Inter -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    .count-bump-up {
      animation: bumpUp 0.15s ease-out;
    }
    .count-bump-down {
      animation: bumpDown 0.15s ease-out;
    }

    @keyframes bumpUp {
      0% { transform: scale(1); }
      50% { transform: scale(1.15) translateY(-4px); }
      100% { transform: scale(1) translateY(0); }
    }

    @keyframes bumpDown {
      0% { transform: scale(1); }
      50% { transform: scale(0.88) translateY(4px); }
      100% { transform: scale(1) translateY(0); }
    }

    /* Glassmorphic background effects */
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <div class="w-full max-w-md mx-auto space-y-6">
    
    <!-- Top Header -->
    <div class="text-center space-y-1">
      <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
        Interactive Counter
      </h1>
      <p class="text-xs text-slate-400">Use screen controls or Keyboard Arrow Keys</p>
    </div>

    <!-- Main Widget Card -->
    <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6 transition-all duration-300">
      
      <!-- Counter Display Container -->
      <div class="relative flex flex-col items-center justify-center p-6 bg-slate-900/60 rounded-xl border border-slate-800 shadow-inner">
        
        <!-- Status indicator tag -->
        <span id="status-tag" class="absolute top-3 right-3 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider bg-slate-800 text-slate-400 transition-colors duration-300">
          Zero
        </span>

        <!-- Number readout -->
        <div id="counter-value" class="text-6xl sm:text-7xl font-extrabold tracking-tight text-slate-100 transition-colors duration-300 my-2 select-none">
          0
        </div>

        <div id="step-indicator" class="text-xs font-medium text-slate-500 mt-1">
          Step size: ±<span id="step-val-label">1</span>
        </div>
      </div>

      <!-- Action Buttons (Decrement / Increment) -->
      <div class="grid grid-cols-2 gap-4">
        <button id="btn-decrement" 
                class="group relative flex items-center justify-center gap-2 py-4 px-6 bg-rose-600/20 hover:bg-rose-600/30 active:bg-rose-600/40 text-rose-400 border border-rose-500/30 rounded-xl font-bold text-xl transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-rose-500/50 shadow-lg active:scale-95 select-none"
                title="Decrement (Down Arrow)">
          <i class="fa-solid fa-minus text-base group-hover:-translate-x-0.5 transition-transform"></i>
          <span>Decrement</span>
        </button>

        <button id="btn-increment" 
                class="group relative flex items-center justify-center gap-2 py-4 px-6 bg-emerald-600/20 hover:bg-emerald-600/30 active:bg-emerald-600/40 text-emerald-400 border border-emerald-500/30 rounded-xl font-bold text-xl transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 shadow-lg active:scale-95 select-none"
                title="Increment (Up Arrow)">
          <i class="fa-solid fa-plus text-base group-hover:translate-x-0.5 transition-transform"></i>
          <span>Increment</span>
        </button>
      </div>

      <!-- Configuration Controls (Step Size) -->
      <div class="space-y-2 pt-2 border-t border-slate-800/80">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 text-center">
          Custom Step Size
        </label>
        <div class="flex items-center justify-center gap-2">
          <button data-step="1" class="step-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white border border-indigo-500 transition-all">1</button>
          <button data-step="5" class="step-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition-all">5</button>
          <button data-step="10" class="step-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition-all">10</button>
          <button data-step="100" class="step-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition-all">100</button>
          
          <!-- Custom Input -->
          <div class="relative flex items-center">
            <input type="number" id="custom-step-input" min="1" max="9999" value="1" 
                   class="w-16 px-2 py-1 text-center text-xs font-semibold bg-slate-900 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-indigo-500"
                   placeholder="Custom" />
          </div>
        </div>
      </div>

      <!-- Reset & Extra Actions -->
      <div class="flex gap-2">
        <button id="btn-reset" 
                class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-300 border border-slate-700 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-slate-500/50 flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-right"></i>
          <span>Reset Counter</span>
        </button>
      </div>

    </div>

    <!-- Keyboard Shortcuts Guide Footer -->
    <div class="p-3 glass-card rounded-xl text-center text-xs text-slate-400 space-y-1">
      <div class="flex items-center justify-center gap-4 text-[11px]">
        <span class="flex items-center gap-1">
          <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono">↑</kbd> Add
        </span>
        <span class="flex items-center gap-1">
          <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono">↓</kbd> Subtract
        </span>
        <span class="flex items-center gap-1">
          <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono">R</kbd> Reset
        </span>
      </div>
    </div>

  </div>

  <script>
    // State management
    let state = {
      count: 0,
      step: 1
    };

    // DOM Elements
    const counterValueEl = document.getElementById('counter-value');
    const statusTagEl = document.getElementById('status-tag');
    const stepValLabelEl = document.getElementById('step-val-label');
    const btnIncrement = document.getElementById('btn-increment');
    const btnDecrement = document.getElementById('btn-decrement');
    const btnReset = document.getElementById('btn-reset');
    const stepBtns = document.querySelectorAll('.step-btn');
    const customStepInput = document.getElementById('custom-step-input');

    function updateUI(direction = null) {
      // Set text content
      counterValueEl.textContent = state.count.toLocaleString();
      stepValLabelEl.textContent = state.step;

      // Dynamic color & tag shifts
      if (state.count > 0) {
        counterValueEl.className = 'text-6xl sm:text-7xl font-extrabold tracking-tight text-emerald-400 transition-colors duration-300 my-2 select-none';
        statusTagEl.textContent = 'Positive';
        statusTagEl.className = 'absolute top-3 right-3 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider bg-emerald-950/80 text-emerald-400 border border-emerald-800/50';
      } else if (state.count < 0) {
        counterValueEl.className = 'text-6xl sm:text-7xl font-extrabold tracking-tight text-rose-400 transition-colors duration-300 my-2 select-none';
        statusTagEl.textContent = 'Negative';
        statusTagEl.className = 'absolute top-3 right-3 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider bg-rose-950/80 text-rose-400 border border-rose-800/50';
      } else {
        counterValueEl.className = 'text-6xl sm:text-7xl font-extrabold tracking-tight text-slate-100 transition-colors duration-300 my-2 select-none';
        statusTagEl.textContent = 'Zero';
        statusTagEl.className = 'absolute top-3 right-3 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider bg-slate-800 text-slate-400';
      }

      // Bump animations
      counterValueEl.classList.remove('count-bump-up', 'count-bump-down');
      // Trigger reflow for animation restart
      void counterValueEl.offsetWidth;
      
      if (direction === 'up') {
        counterValueEl.classList.add('count-bump-up');
      } else if (direction === 'down') {
        counterValueEl.classList.add('count-bump-down');
      }

      // Sync step button highlights
      stepBtns.forEach(btn => {
        const btnStep = parseInt(btn.dataset.step, 10);
        if (btnStep === state.step) {
          btn.className = 'step-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white border border-indigo-500 transition-all shadow-md';
        } else {
          btn.className = 'step-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition-all';
        }
      });
    }

    function increment() {
      state.count += state.step;
      updateUI('up');
    }

    function decrement() {
      state.count -= state.step;
      updateUI('down');
    }

    function reset() {
      state.count = 0;
      updateUI(null);
    }

    function setStep(newStep) {
      const parsed = parseInt(newStep, 10);
      if (!isNaN(parsed) && parsed > 0) {
        state.step = parsed;
        customStepInput.value = parsed;
        updateUI();
      }
    }

    btnIncrement.addEventListener('click', increment);
    btnDecrement.addEventListener('click', decrement);
    btnReset.addEventListener('click', reset);

    // Preset Step Buttons
    stepBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        setStep(btn.dataset.step);
      });
    });

    // Custom Step Input
    customStepInput.addEventListener('input', (e) => {
      setStep(e.target.value);
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      // Prevent shortcut trigger when typing in inputs
      if (document.activeElement.tagName === 'INPUT') return;

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        increment();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        decrement();
      } else if (e.key.toLowerCase() === 'r') {
        e.preventDefault();
        reset();
      }
    });

    // Initial Render
    updateUI();
  </script>
</body>
</html>
